  <script>
var viewer = WALK.getViewer();
	
    // let nodeNames01 = ['curtian_3:그룹#30']
    // const nodeNames02 = ['curtain_2:그룹#28']
    // const nodeNames03 = ['curtain_1:그룹#141']
    // const nodeNames = ['curtain_1:그룹#141', 'curtain_2:그룹#28', 'curtian_3:그룹#30']

    var stage_change_onoff = true;
    var stage_change_isplaying = false;
    function testBtn01() {
      if (stage_change_isplaying) return;

      stage_change_isplaying = true;

      if (stage_change_onoff == true) {
        nodeNames1.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.hide(); } })
        viewer.requestFrame()

        setTimeout(() => {
          nodeNames2.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.hide(); } })
          viewer.requestFrame();

          setTimeout(() => {
            nodeNames3.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.hide(); } })
            viewer.requestFrame()
            stage_change_onoff = false;
            stage_change_isplaying = false;
          }, 550);
        }, 550);



      } else {
        // nodeNames.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.show(); } })
        // viewer.requestFrame()
        // stage_change_step = 0

        nodeNames3.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.show(); } })
        viewer.requestFrame()

        setTimeout(() => {
          nodeNames2.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.show(); } })
          viewer.requestFrame();

          setTimeout(() => {
            nodeNames1.forEach((name) => { for (const node of viewer.findNodesOfType(name)) { node.show(); } })
            viewer.requestFrame()
            stage_change_onoff = true;
            stage_change_isplaying = false;
          }, 550);
        }, 550);


      }
    }
    function testBtn02() {
      var viewer = WALK.getViewer();
      var vpos = viewer.getCameraPosition();
      var vrot = viewer.getCameraRotation();
      var vec3_rot = vrot.toVector3()

      var display = document.getElementById('coord_display');

      let lpx = parseFloat(vpos.x).toFixed(2);
      let lpy = parseFloat(vpos.y).toFixed(2);
      let lpz = parseFloat(vpos.z).toFixed(2);

      let lrx = parseFloat(vec3_rot.x).toFixed(2);
      let lry = parseFloat(vec3_rot.y).toFixed(2);
      let lrz = parseFloat(vec3_rot.z).toFixed(2);

      display.value = display.value + `\n"X": ${lpx},"Y": ${lpy},"Z": ${lpz},\n"X": ${lrx},"Y": ${lry},"Z": ${lrz},\n`;

      document.getElementById('input_x').value = lpx;
      document.getElementById('input_y').value = lpy;
      document.getElementById('input_z').value = lpz;
      document.getElementById('input_rotx').value = lrx;
      document.getElementById('input_roty').value = lry;
      document.getElementById('input_rotz').value = lrz;
    }

    function testBtn03() {
      const x = parseFloat(document.getElementById('input_x').value) || 0;
      const y = parseFloat(document.getElementById('input_y').value) || 0;
      const z = parseFloat(document.getElementById('input_z').value) || 0;
      const rx = parseFloat(document.getElementById('input_rotx').value) || 0;
      const ry = parseFloat(document.getElementById('input_roty').value) || 0;
      const rz = parseFloat(document.getElementById('input_rotz').value) || 0;

      var pos = viewer.getCameraPosition();
      var rot = viewer.getCameraRotation();
      var view = new WALK.View();
      view.rotation.yawDeg = rot.yawDeg;
      view.rotation.pitchDeg = rot.pitchDeg;

      view.position.x = x;
      view.position.y = y;
      view.position.z = z;

      view.rotation.x = rx;
      view.rotation.y = ry;
      view.rotation.z = rz;

      viewer.switchToView(view);
    }

    function testBtn05_lootat2() {
      if (isNavigating) return;

      let lx = parseFloat(document.getElementById('input_lx').value) || 0;
      let ly = parseFloat(document.getElementById('input_ly').value) || 0;
      let lz = parseFloat(document.getElementById('input_lz').value) || 0;

      let vec_LookAt2 = new THREE.Vector3(lx, ly, lz);

      //var viewer = WALK.getViewer();
      var pos = viewer.getCameraPosition();
      //var display = document.getElementById('coord_display');
      let lpx = parseFloat(pos.x).toFixed(2);
      let lpy = parseFloat(pos.y).toFixed(2);
      let lpz = parseFloat(pos.z).toFixed(2);

      document.getElementById('input_x').value = lpx;
      document.getElementById('input_y').value = lpy;
      document.getElementById('input_z').value = lpz;

      var view = new WALK.View();
      view.position = pos;


      const m = new THREE.Matrix4();
      m.lookAt(view.position, vec_LookAt2, new THREE.Vector3(0, 0, 1));
      let ves = new THREE.Euler();
      ves.setFromRotationMatrix(m, 'ZYX');
      //const euler = new THREE.Euler().setFromRotationMatrix(m, 'ZXY');
      console.log("ves", ves);

      //view.rotation.z = ves.z;  // Z축 회전량 (수평 회전 = Yaw)

      // 1. 카메라에서 바라볼 목표점(vec_LookAt)까지의 상대 거리 벡터 계산
      var dx = vec_LookAt2.x - view.position.x;
      var dy = vec_LookAt2.y - view.position.y;
      var dz = vec_LookAt2.z - view.position.z;

      // 2. 수평 거리(바닥면 거리) 계산
      var horizontalDistance = Math.sqrt(dx * dx + dy * dy);

      // 3. 삼각함수를 통한 정확한 Yaw 및 Pitch 값 추출
      // Shapespark 좌표계 기준에 맞춘 아크탄젠트/아크사인 계산
      //view.rotation.yaw = Math.atan2(dy, dx);
      view.rotation.yaw = ves.z;
      view.rotation.pitch = Math.atan2(dz, horizontalDistance); // 높이차(dz)와 수평거리 비율로 피치 계산

      // 4. 만약 여전히 반대로 뒤집혀 보인다면 아래 주석을 풀고 조절해 보세요
      // view.rotation.pitch = -Math.atan2(dz, horizontalDistance); 

      isNavigating = true;
      viewer.switchToView(view);
      viewer.requestFrame();

      setTimeout(() => {
        isNavigating = false;
      }, 1100);

    }
